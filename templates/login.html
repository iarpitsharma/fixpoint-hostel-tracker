<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixPoint - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white font-bold text-xl mb-3">
        FP
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Sign in to FixPoint</h1>
      <p class="text-xs text-slate-500 mt-1">Hostel Grievance Redressal Portal</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for category, msg in messages %}
            <div class="p-3 rounded-lg text-xs font-medium {% if category == 'error' %}bg-rose-100 text-rose-700{% elif category == 'warning' %}bg-amber-100 text-amber-700{% else %}bg-emerald-100 text-emerald-700{% endif %}">
              {{ msg }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
        <input 
          type="text" 
          name="username" 
          required 
          placeholder="Enter your username" 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        >
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input 
          type="password" 
          name="password" 
          required 
          placeholder="••••••••" 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
        >
      </div>

      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors shadow-sm"
      >
        Sign In
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500">
      Don't have an account? 
      <a href="{{ url_for('register') }}" class="text-indigo-600 font-semibold hover:underline">Register here</a>
    </div>
  </div>
</body>
</html>
