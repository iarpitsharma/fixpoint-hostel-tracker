<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FixPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <span class="inline-block p-2 rounded-full bg-indigo-600/20 text-indigo-400 mb-2 font-mono font-bold text-lg">⚡ FixPoint</span>
            <h2 class="text-2xl font-bold tracking-tight">Student Registration</h2>
            <p class="text-slate-400 text-sm mt-1">Create an account to track your hostel complaints</p>
        </div>

        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
                <input type="text" name="name" required placeholder="e.g. Rahul Verma" 
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Hostel Room & Block</label>
                <input type="text" name="room_no" required placeholder="e.g. NC2 - Room 808" 
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">College Email</label>
                <input type="email" name="email" required placeholder="e.g. rahul@hostel.com" 
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all mt-2">
                Create Student Account
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-700 text-center text-sm text-slate-400">
            Already registered? 
            <a href="/login" class="text-indigo-400 hover:text-indigo-300 font-medium ml-1">Sign In</a>
        </div>
    </div>
</body>
</html>
