<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixPoint - Student Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .cyber-grid {
      background-color: #060913;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 36px 36px;
    }
  </style>
</head>
<body class="cyber-grid min-h-screen flex items-center justify-center p-4 text-slate-100">
  <div class="max-w-md w-full bg-slate-900/90 rounded-3xl shadow-2xl border border-white/10 p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-red-600 text-white font-black text-xl mb-3 shadow-lg">
        FP
      </div>
      <h1 class="text-2xl font-black text-white">Resident Registration</h1>
      <p class="text-xs text-slate-400 mt-1">Join FixPoint hostel maintenance portal</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for category, msg in messages %}
            <div class="p-3 rounded-xl text-xs font-semibold {% if category == 'error' %}bg-rose-950/80 border border-rose-700 text-rose-200{% elif category == 'warning' %}bg-amber-950/80 border border-amber-700 text-amber-200{% else %}bg-emerald-950/80 border border-emerald-700 text-emerald-200{% endif %}">
              {{ msg }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Student UID / Username</label>
        <input 
          type="text" 
          name="username" 
          required 
          placeholder="e.g. 26BCS12057" 
          class="w-full bg-slate-950 px-4 py-2.5 text-sm border border-slate-700 rounded-xl text-white focus:outline-none focus:border-red-500"
        >
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Password</label>
        <input 
          type="password" 
          name="password" 
          required 
          placeholder="••••••••" 
          class="w-full bg-slate-950 px-4 py-2.5 text-sm border border-slate-700 rounded-xl text-white focus:outline-none focus:border-red-500"
        >
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Hostel Room No.</label>
        <input 
          type="text" 
          name="room_no" 
          required 
          placeholder="e.g. NC2 - 808" 
          class="w-full bg-slate-950 px-4 py-2.5 text-sm border border-slate-700 rounded-xl text-white focus:outline-none focus:border-red-500"
        >
      </div>

      <button 
        type="submit" 
        class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg mt-2"
      >
        Create Account
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-400">
      Already registered? 
      <a href="{{ url_for('login') }}" class="text-red-400 font-bold hover:underline ml-1">Log in here</a>
    </div>
  </div>
</body>
</html>
