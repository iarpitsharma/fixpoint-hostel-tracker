<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixPoint - Register New Grievance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .cyber-grid {
      background-color: #5a0b0d;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    .glass-card {
      background: rgba(140, 20, 24, 0.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="min-h-screen cyber-grid flex flex-col justify-between text-white p-4">
  
  <div class="max-w-xl mx-auto w-full my-auto glass-card rounded-3xl p-8 border">
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-white/20">
      <div>
        <h1 class="text-xl font-black text-white">Log Infrastructure Ticket</h1>
        <p class="text-xs text-red-200 mt-0.5">Facility dispatch & room grievance submission</p>
      </div>
      <a href="{{ url_for('student_dashboard') }}" class="text-xs font-bold text-white hover:underline bg-black/20 px-3 py-1.5 rounded-xl border border-white/20">
        ← Back to Feed
      </a>
    </div>

    <form action="{{ url_for('new_complaint') }}" method="POST" enctype="multipart/form-data" class="space-y-4 text-xs font-semibold">
      <div>
        <label class="block mb-1.5 uppercase tracking-wider font-mono text-white/90">Grievance Title</label>
        <input 
          type="text" 
          name="title" 
          required 
          placeholder="e.g. Ceiling fan bearing noisy / Water geyser tripping" 
          class="w-full bg-black/30 border border-white/30 rounded-xl px-4 py-2.5 text-white placeholder-white/40 focus:outline-none focus:border-white"
        >
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block mb-1.5 uppercase tracking-wider font-mono text-white/90">Category</label>
          <select name="category" required class="w-full bg-black/40 border border-white/30 rounded-xl px-3 py-2.5 text-white focus:outline-none">
            <option value="Electrical" {% if prefill_category == 'Electrical' %}selected{% endif %}>⚡ Electrical</option>
            <option value="Plumbing" {% if prefill_category == 'Plumbing' %}selected{% endif %}>🚰 Plumbing</option>
            <option value="Carpentry" {% if prefill_category == 'Carpentry' %}selected{% endif %}>🪑 Carpentry</option>
            <option value="Wi-Fi / LAN" {% if prefill_category == 'Wi-Fi' %}selected{% endif %}>📡 Wi-Fi / LAN</option>
            <option value="Cleaning" {% if prefill_category == 'Cleaning' %}selected{% endif %}>🧹 Cleaning</option>
            <option value="Other">📦 Other Issue</option>
          </select>
        </div>

        <div>
          <label class="block mb-1.5 uppercase tracking-wider font-mono text-white/90">Priority Tier</label>
          <select name="priority" required class="w-full bg-black/40 border border-white/30 rounded-xl px-3 py-2.5 text-white focus:outline-none">
            <option value="Low">Low (Non-urgent)</option>
            <option value="Medium" selected>Medium (Standard)</option>
            <option value="High">High (Immediate)</option>
            <option value="Emergency">🚨 Emergency (Hazard)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block mb-1.5 uppercase tracking-wider font-mono text-white/90">Issue Description</label>
        <textarea 
          name="description" 
          rows="3" 
          required 
          placeholder="Explain specific defect, location in room, when it started..." 
          class="w-full bg-black/30 border border-white/30 rounded-xl px-4 py-2 text-white placeholder-white/40 focus:outline-none focus:border-white"
        ></textarea>
      </div>

      <div>
        <label class="block mb-1.5 uppercase tracking-wider font-mono text-white/90">Photo Evidence (Optional)</label>
        <input 
          type="file" 
          name="image" 
          accept="image/*" 
          class="w-full bg-black/20 border border-white/20 rounded-xl p-2 text-white file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-white file:text-red-900 cursor-pointer"
        >
      </div>

      <button 
        type="submit" 
        class="w-full bg-white hover:bg-slate-100 text-red-900 font-extrabold py-3 rounded-xl shadow-lg transition mt-2 text-sm"
      >
        Submit Grievance to Warden Desk
      </button>
    </form>
  </div>

  <footer class="text-center py-4 text-xs font-mono text-red-200">
    FixPoint v2.0 • Created by Arpit Sharma (26BCS12057)
  </footer>
</body>
</html>
