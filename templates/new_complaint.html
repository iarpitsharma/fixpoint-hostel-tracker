<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise Grievance | FixPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 shadow-2xl">
        <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-6">
            <div>
                <h2 class="text-xl font-bold">Raise New Grievance</h2>
                <p class="text-xs text-slate-400 mt-0.5">Backed by 24-Hour SLA Escalation Guarantee</p>
            </div>
            <a href="/dashboard" class="text-xs px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-slate-300">
                Cancel
            </a>
        </div>

        <form action="/new_complaint" method="POST" enctype="multipart/form-data" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Category</label>
                <select name="category" required 
                        class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white">
                    <option value="Plumbing">Plumbing (Water leakage, tap, flush)</option>
                    <option value="Electrical">Electrical (Fan, light, socket, switch)</option>
                    <option value="Carpentry">Carpentry (Bed, door lock, cupboard, window)</option>
                    <option value="Wi-Fi/Network">Wi-Fi & LAN Network</option>
                    <option value="Cleanliness">Room & Washroom Cleanliness</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Issue Title</label>
                <input type="text" name="title" required placeholder="e.g. Washroom tap constantly leaking" 
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Priority Level</label>
                <div class="grid grid-cols-3 gap-3">
                    <label class="flex items-center justify-center p-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-indigo-500">
                        <input type="radio" name="priority" value="Normal" checked class="text-indigo-600 mr-2">
                        <span class="text-sm">Normal</span>
                    </label>
                    <label class="flex items-center justify-center p-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-amber-500">
                        <input type="radio" name="priority" value="Urgent" class="text-amber-500 mr-2">
                        <span class="text-sm text-amber-400">Urgent</span>
                    </label>
                    <label class="flex items-center justify-center p-3 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer hover:border-rose-500">
                        <input type="radio" name="priority" value="Emergency" class="text-rose-500 mr-2">
                        <span class="text-sm text-rose-400">Emergency</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Detailed Description</label>
                <textarea name="description" rows="3" required placeholder="Specify exact details (e.g. 3rd floor washroom, middle tap)" 
                          class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-500"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Attach Photo (Optional)</label>
                <input type="file" name="photo" accept="image/*" 
                       class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all mt-4">
                Submit Grievance
            </button>
        </form>
    </div>
</body>
</html>
