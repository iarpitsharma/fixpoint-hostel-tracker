<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixPoint - Report Issue</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 sm:p-8">
  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sm:p-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Report a Grievance</h1>
        <p class="text-xs text-slate-500">Provide complete details to help the warden address the issue quickly.</p>
      </div>
      <a href="{{ url_for('student_dashboard') }}" class="text-xs font-semibold text-slate-500 hover:text-slate-800">
        &larr; Back
      </a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for category, msg in messages %}
            <div class="p-3 rounded-lg text-xs font-medium {% if category == 'error' %}bg-rose-100 text-rose-700{% elif category == 'warning' %}bg-amber-100 text-amber-700{% else %}bg-emerald-100 text-emerald-700{% endif %}">
              {{ msg }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('new_complaint') }}" method="POST" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Issue Title</label>
        <input 
          type="text" 
          name="title" 
          required 
          placeholder="e.g. Geyser not heating water in washroom 2" 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Category</label>
          <select 
            name="category" 
            required 
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="Electricity">Electricity</option>
            <option value="Plumbing">Plumbing</option>
            <option value="Carpentry">Carpentry</option>
            <option value="Wi-Fi & Internet">Wi-Fi & Internet</option>
            <option value="Cleanliness">Cleanliness</option>
            <option value="Mess / Food">Mess / Food</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Priority</label>
          <select 
            name="priority" 
            required 
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            <option value="Urgent">Urgent</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Detailed Description</label>
        <textarea 
          name="description" 
          rows="4" 
          required 
          placeholder="Describe the problem, location, and how long it has persisted..." 
          class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Attach Photo (Optional)</label>
        <input 
          type="file" 
          name="image" 
          accept="image/*" 
          class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
        >
      </div>

      <div class="pt-2 flex items-center justify-end space-x-3">
        <a href="{{ url_for('student_dashboard') }}" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">
          Cancel
        </a>
        <button 
          type="submit" 
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-5 rounded-lg text-sm transition-colors shadow-sm"
        >
          Submit Ticket
        </button>
      </div>
    </form>
  </div>
</body>
</html>
